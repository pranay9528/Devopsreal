apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kumarstack-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-2:702147683442:certificate/95be40b0-8a73-4368-a542-54aadf122c68
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  rules:
    - host: kumarstack.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kumarstack-service
                port:
                  number: 80