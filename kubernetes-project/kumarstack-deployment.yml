apiVersion: apps/v1
kind: Deployment

metadata:
  name: kumarstack-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: kumarstack

  template:
    metadata:
      labels:
        app: kumarstack

    spec:
      containers:
        - name: kumarstack
          image: pranay9528/kumarstack:v2
          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: kumarstack-config
            - secretRef:
                name: kumarstack-secret