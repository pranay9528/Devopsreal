apiversion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: kumarstack-eks
  region: eu-west-2
vpc:
  nat:
    gateway: Disable
managedNodeGroups:
  - name: kumarstack-nodes
    instanceType: t3.small
    minSize: 1
    maxSize: 2
    desiredCapacity: 1
    volumeSize: 20
    volumeType: gp3

