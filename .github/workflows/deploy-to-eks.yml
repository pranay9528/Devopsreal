name: Build and Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  EKS_CLUSTER: kumarstack-eks
  DOCKER_IMAGE: pranay9528/kumarstack

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $DOCKER_IMAGE:${{ github.sha }} ./docker-project

      - name: Push Docker image
        run: |
          docker push \
            $DOCKER_IMAGE:${{ github.sha }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/kumarstack-deployment \
            kumarstack=$DOCKER_IMAGE:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/kumarstack-deployment